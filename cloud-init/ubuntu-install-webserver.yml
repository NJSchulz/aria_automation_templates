# Used by the AWX job template "Ubuntu web server + kubectl (cloud-init)"
# (project vcfa-project, playbook path cloud-init/ubuntu-install-webserver.yml).
# The filename and path are kept so existing templates and VCFA blueprints
# keep working; a rename can follow once those references are updated together.
#
# This playbook no longer installs nginx. It installs a pinned kubectl from
# pkgs.k8s.io and writes a provenance marker so SSH and the AWX job record
# can show that AWX configured the VM.
- hosts: all
  name: Install kubectl and write a lab provenance marker
  become: true
  vars:
    kubectl_minor: "v1.35"   # keep within one minor version of the clusters you manage
  tasks:
    - name: Wait for any other apt/dpkg process to finish
      shell: |
        timeout 600 bash -c 'while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for apt lock to be released..."; sleep 5;
        done'
      changed_when: false

    - name: Upgrade all packages
      apt:
        upgrade: dist
        update_cache: yes
        cache_valid_time: 3600

    - name: Ensure apt keyring directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Kubernetes apt signing key
      get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubectl_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"
        timeout: 30
      register: k8s_key
      retries: 3
      delay: 10
      until: k8s_key is succeeded

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ kubectl_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubectl from the Kubernetes apt repo
      apt:
        name: kubectl
        state: present
        update_cache: yes
      register: kubectl_pkg
      retries: 3
      delay: 15
      until: kubectl_pkg is succeeded

    - name: Verify kubectl
      command: kubectl version --client
      register: kubectl_ver
      changed_when: false

    - name: Write lab provenance marker
      copy:
        dest: /etc/lab-provisioned.json
        owner: root
        group: root
        mode: "0644"
        content: "{{ lab_provenance | to_nice_json }}\n"
      vars:
        lab_provenance:
          tool: awx
          source: "{{ awx_job_template_name | default('unknown') }}"
          version: "{{ ansible_version.full }}"
          host: "{{ ansible_hostname | default(inventory_hostname) }}"
          configured_at: "{{ ansible_date_time.iso8601 }}"
          job_id: "{{ awx_job_id | default('unknown') }}"

    - name: Write a static motd banner
      copy:
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"
        content: |
          ************************************************************************
            This system was configured by AWX/Ansible.
            Template: {{ awx_job_template_name | default('unknown') }}    Job: {{ awx_job_id | default('unknown') }}
            See /etc/lab-provisioned.json for provision details.
          ************************************************************************

    - name: Write a dynamic motd banner for Ubuntu SSH logins
      copy:
        dest: /etc/update-motd.d/99-lab-awx
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          echo
          echo "************************************************************************"
          echo "  This system was configured by AWX/Ansible."
          echo "  Template: {{ awx_job_template_name | default('unknown') }}    Job: {{ awx_job_id | default('unknown') }}"
          echo "  See /etc/lab-provisioned.json for provision details."
          echo "************************************************************************"
          echo

    # Reboot is kept: it applies the dist-upgrade (kernel/libc and friends),
    # not nginx. The ansible reboot module reconnects when the host is back.
    - name: Reboot the VM after updates
      reboot:
        msg: "Rebooting the VM to apply updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: whoami
