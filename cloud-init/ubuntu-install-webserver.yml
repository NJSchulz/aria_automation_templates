- hosts: all
  name: Ansible playbook to install a web server
  become: true
  vars:
    kubectl_minor: "v1.35"   # keep within one minor version of the clusters you manage
  tasks:
    - name: Wait for any other apt/dpkg process to finish
      shell: |
        timeout 600 bash -c 'while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          echo "Waiting for apt lock to be released..."; sleep 5;
        done'
      changed_when: false

    - name: Upgrade all packages
      apt:
        upgrade: dist
        update_cache: yes
        cache_valid_time: 3600

    - name: Install nginx (latest version)
      apt:
        name: nginx
        state: latest
        update_cache: yes

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Ensure apt keyring directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Kubernetes apt signing key
      get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubectl_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: "0644"
        timeout: 30
      register: k8s_key
      retries: 3
      delay: 10
      until: k8s_key is succeeded

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ kubectl_minor }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Install kubectl from the Kubernetes apt repo
      apt:
        name: kubectl
        state: present
        update_cache: yes
      register: kubectl_pkg
      retries: 3
      delay: 15
      until: kubectl_pkg is succeeded

    - name: Verify kubectl
      command: kubectl version --client
      register: kubectl_ver
      changed_when: false

    - name: Reboot the VM after updates
      reboot:
        msg: "Rebooting the VM to apply updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: whoami
